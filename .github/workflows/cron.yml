name: Hourly Cron
on:
  schedule:
    - cron: '0 * * * *'  # every hour
  workflow_dispatch:
jobs:
  call-api:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cron endpoint
        run: >
          curl -f --max-time 55
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
          https://hmlml-jade.vercel.app/api/sync-hourly
